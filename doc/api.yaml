info:
  title: My API
  description: API description
  version: '1.0'
  contact: {}
tags: []
servers: []
components:
  schemas:
    CreateUserDto:
      type: object
      properties:
        login:
          type: string
          example: SomeGreatLogin
          description: User login
        password:
          type: string
          example: '12345'
          description: User password
      required:
        - login
        - password
    UpdatePasswordDto:
      type: object
      properties:
        oldPassword:
          type: string
          example: '12345'
          description: Previous user password
        newPassword:
          type: string
          example: new_password
          description: New user password
      required:
        - oldPassword
        - newPassword
    CreateArtistDto:
      type: object
      properties:
        name:
          type: string
          example: Michael Jackson
          description: Artist name
        grammy:
          type: boolean
          example: 'True'
          description: Shows if artist have ever won a Grammy Award
      required:
        - name
        - grammy
    UpdateArtistDto:
      type: object
      properties:
        name:
          type: string
          example: Michael Jackson
          description: Artist name
        grammy:
          type: boolean
          example: 'True'
          description: Shows if artist have ever won a Grammy Award
      required:
        - name
        - grammy
    CreateTrackDto:
      type: object
      properties:
        name:
          type: string
          example: The line
          description: Track name
        artistId:
          type: string
          example: 61f0c404-5cb3-11e7-907b-a6006ad3dba0
          description: Id of the artist to which the track belongs
        albumId:
          type: string
          example: 61f0c404-5cb3-11e7-907b-a6006ad3dba0
          description: Id of the album to which the track belongs
        duration:
          type: number
          example: '192'
          description: Track duration
      required:
        - name
        - duration
    UpdateTrackDto:
      type: object
      properties:
        name:
          type: string
          example: The line
          description: Track name
        artistId:
          type: string
          example: 61f0c404-5cb3-11e7-907b-a6006ad3dba0
          description: Id of the artist to which the track belongs
        albumId:
          type: string
          example: 61f0c404-5cb3-11e7-907b-a6006ad3dba0
          description: Id of the album to which the track belongs
        duration:
          type: number
          example: '192'
          description: Track duration
      required:
        - name
        - duration
    CreateAlbumDto:
      type: object
      properties:
        name:
          type: string
          example: Led Zeppelin III
          description: Album name
        year:
          type: number
          example: '1970'
          description: Album release date
        artistId:
          type: string
          example: 61f0c404-5cb3-11e7-907b-a6006ad3dba0
          description: Artist id
      required:
        - name
        - year
    UpdateAlbumDto:
      type: object
      properties:
        name:
          type: string
          example: Led Zeppelin III
          description: Album name
        year:
          type: number
          example: '1970'
          description: Album release date
        artistId:
          type: string
          example: 61f0c404-5cb3-11e7-907b-a6006ad3dba0
          description: Artist id
      required:
        - name
        - year
